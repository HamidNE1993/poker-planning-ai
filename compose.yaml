services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poker_planning}
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poker} -d ${POSTGRES_DB:-poker_planning}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-poker_planning}
      DB_USERNAME: ${POSTGRES_USER:-poker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-poker}
      SPRING_PROFILES_ACTIVE: prod
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  postgres_data:
